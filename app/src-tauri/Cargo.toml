[package]
name = "importcity"
version = "1.0.0"
description = "RealMap: import a real-world area into Transport Fever 3"
authors = ["Wilfried Lambert"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["gzip", "brotli"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
